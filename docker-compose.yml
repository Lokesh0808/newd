# Local development stack for CareerAI.
#
#   docker compose up -d db
#   npm run db:migrate && npm run db:seed
#
services:
  db:
    image: postgres:16-alpine
    container_name: careerai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerai
      POSTGRES_PASSWORD: careerai
      POSTGRES_DB: careerai
    ports:
      - "5432:5432"
    volumes:
      - careerai-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerai -d careerai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  careerai-db-data:
